# Publishes the website in site/ to GitHub Pages whenever it changes on main, with the editor itself in site/app/
# (the online version: ROM files only, the emulator through coi-sw.js)
name: Website

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml', 'index.html', 'coi-sw.js', 'css/**', 'js/**', 'lib/**', 'data/**', 'docs/*.pdf']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: The editor in site/app
        run: |
          mkdir -p site/app/docs
          cp -r index.html coi-sw.js css js lib data site/app/
          cp docs/*.pdf site/app/docs/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
