<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ember Studio</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header>
  <button id="btnSide" class="iconbtn" title="Show or hide the side bar">☰</button>
  <div class="brand">🔥 Ember Studio <span id="projname" class="projname"></span></div>
  <button id="btnSearch" class="searchbtn needrom" disabled title="Search everything (Ctrl+K)">🔍 <span>Search…</span> <kbd>Ctrl K</kbd></button>
  <div class="right">
    <span id="romname" class="muted"></span>
    <span id="watching" class="muted"></span>
    <span id="dirty" class="warn"></span>
    <button id="btnProjSave" class="needproj primary" hidden title="Ctrl+S">💾 Save</button>
    <button id="btnProjBuild" class="needproj" hidden title="Makes out/game.gba in the project folder">🔨 Build</button>
    <button id="btnProjPlay" class="needproj" hidden title="Build the game and play it in mGBA">▶ Build & play</button>
    <button id="btnSaveFile" class="needrom romonly" hidden>💾 Save to file</button>
    <button id="btnPatch" class="needrom romonly" disabled title="Adds Hebrew fonts, the right-to-left engine and the Hebrew keyboard, then saves a NEW .gba file">🔧 Patch game → new .gba</button>
    <button id="btnIPS" class="needrom romonly" disabled title="Patch file with all your changes (share this instead of the ROM)">IPS patch</button>
    <button id="btnDownload" class="needrom romonly primary" disabled>Download ROM</button>
    <button id="btnPlay" class="needrom" disabled title="Play the game as it is now, inside the editor">🎮 Play</button>
    <button id="btnHelp" title="Open the user guide (PDF)">❓ Guide</button>
    <button id="btnLang" title="Interface language">English</button>
  </div>
</header>
<div class="shell">
  <aside id="side"><nav id="nav"></nav></aside>
  <main id="main"></main>
</div>
<div id="toasts"></div>
